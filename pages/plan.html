<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Plan</title>
        <!--Connect stylesheet-->
        <link rel="stylesheet" href="/stylesheets/style.css">>
        <!--Connect font API and stylesheet-->
        <!--Font families: Cantarell (content) and Chango (headings)-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Chango&display=swap" rel="stylesheet">
    </head>

    <body>
        <!--Connect scripts-->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="/scripts/script.js"></script>

        <!-- Upper navigation area -->
        <div class="navigation-area"> <!-- color area to contain nav and logo -->
            <nav>
                <ul>
                    <li>
                        <a href="/index.html">Home</a>
                    </li>
                    <li>
                        <a href="/pages/search.html">Search for recipes</a>
                    </li>
                    <li>
                        <a href="/pages/list.html">Shopping list</a>
                    </li>
                    <!--
                    <li>
                        <a href="/pages/plan.html">Plan meals</a>
                    </li>
                    -->
                </ul>
            </nav>
        </div>

        <!-- Content area-->
        <div id="month-view">
            <!--Monthly calendar, 25% of page-->

        </div>

        <div id="meals-view">
            <!--Planned meals from selected recipes/grocery list-->




            <!--Slots for days of the week in selected week of month-->




            <!--Update month view calendar to represent days with scheduled meals-->
            <!-- Main wrapper for the calendar application -->

            <!-- https://www.w3schools.com/html/html_form_input_types.asp -->
             <!-- add a form to input date range of planning and available saved recipes -->
            <div class="wrapper">
                <div class="container-calendar">
                    <div id="left">
                        <h1>Dynamic Calendar</h1>
                        <div id="event-section">
                            <h3>Add Event</h3>
                            <input type="date" id="eventDate">
                            <input type="text"
                                id="eventTitle"
                                placeholder="Event Title">
                            <input type="text"
                                id="eventDescription"
                                placeholder="Event Description">
                            <button id="addEvent" onclick="addEvent()">
                                Add
                            </button>
                        </div>
                        <div id="reminder-section">
                            <h3>Reminders</h3>
                            <!-- List to display reminders -->
                            <ul id="reminderList">
                                <li data-event-id="1">
                                    <strong>Event Title</strong>
                                    - Event Description on Event Date
                                    <button class="delete-event"
                                        onclick="deleteEvent(1)">
                                        Delete
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div id="right">
                        <h3 id="monthAndYear"></h3>
                        <div class="button-container-calendar">
                            <button id="previous"
                                    onclick="previous()">
                                ‹
                            </button>
                            <button id="next"
                                    onclick="next()">
                                ›
                            </button>
                        </div>
                        <table class="table-calendar"
                            id="calendar"
                            data-lang="en">
                            <thead id="thead-month"></thead>
                            <!-- Table body for displaying the calendar -->
                            <tbody id="calendar-body"></tbody>
                        </table>
                        <div class="footer-container-calendar">
                            <label for="month">Jump To: </label>
                            <!-- Dropdowns to select a specific month and year -->
                            <select id="month" onchange="jump()">
                                <option value=0>Jan</option>
                                <option value=1>Feb</option>
                                <option value=2>Mar</option>
                                <option value=3>Apr</option>
                                <option value=4>May</option>
                                <option value=5>Jun</option>
                                <option value=6>Jul</option>
                                <option value=7>Aug</option>
                                <option value=8>Sep</option>
                                <option value=9>Oct</option>
                                <option value=10>Nov</option>
                                <option value=11>Dec</option>
                            </select>
                            <!-- Dropdown to select a specific year -->
                            <select id="year" onchange="jump()"></select>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </body>
</html>
